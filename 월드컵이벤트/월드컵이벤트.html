<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 월드컵 이벤트</title>
    <style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}
body {
	background-color: #000;
	font-family: sans-serif;
}
.wc_event_wrap {
	width: 100%;
	max-width: 1100px;
	margin: 0 auto;
	position: relative;
	overflow: hidden;
}
.wc_bg_img {
	width: 100%;
	height: auto;
	display: block;
}

/* 별똥별 레이아웃 */
.wc_shooting_stars {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 65%; 
	z-index: 5;
	pointer-events: none;
}
.wc_star {
	position: absolute;
	top: -10px;
	width: 90px; 
	height: 2px;
	background: linear-gradient(-45deg, rgba(255,255,255,1), rgba(255,255,255,0));
	filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
	opacity: 0;
	transform: rotate(-35deg); 
	animation: shooting 4.5s ease-in-out infinite;
}
.wc_star:nth-child(1) { right: 10%; animation-delay: 0s; }
.wc_star:nth-child(2) { right: 35%; animation-delay: 1.8s; width: 130px; animation-duration: 3.8s; }
.wc_star:nth-child(3) { right: 60%; animation-delay: 3.2s; width: 70px; animation-duration: 5s; }

@keyframes shooting {
	0% { transform: translate(0, 0) rotate(-35deg) scale(0); opacity: 0; }
	8% { opacity: 1; transform: translate(-40px, 30px) rotate(-35deg) scale(1); }
	35% { transform: translate(-550px, 380px) rotate(-35deg) scale(0); opacity: 0; }
	100% { transform: translate(-550px, 380px) rotate(-35deg) scale(0); opacity: 0; }
}

/* 반짝이 별 레이어 */
.wc_twinkle_stars {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 35%; 
	z-index: 4; 
	pointer-events: none;
}

/* 큼직한 십자 별 그래픽 */
.wc_twinkle {
	position: absolute;
	width: 24px;  
	height: 24px; 
	opacity: 0;
	animation: twinkleStar 3s ease-in-out infinite;
}
.wc_twinkle::before,
.wc_twinkle::after {
	content: '';
	position: absolute;
	top: 50%;
	left: 50%;
	background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 80%);
	transform: translate(-50%, -50%);
}
.wc_twinkle::before {
	width: 100%;
	height: 3px;
}
.wc_twinkle::after {
	width: 3px;
	height: 100%;
}

/* 별들의 y축 범위(top: 10% ~ 28%) */
.wc_twinkle:nth-child(1) { top: 12%; left: 8%; animation-delay: 0s; animation-duration: 2.2s; transform: scale(1.1); }
.wc_twinkle:nth-child(2) { top: 26%; left: 24%; animation-delay: 0.7s; animation-duration: 3.2s; transform: scale(1.6); } 
.wc_twinkle:nth-child(3) { top: 15%; left: 48%; animation-delay: 1.5s; animation-duration: 2s; transform: scale(1.2); }
.wc_twinkle:nth-child(4) { top: 28%; left: 74%; animation-delay: 0.3s; animation-duration: 3.8s; transform: scale(1.5); } 
.wc_twinkle:nth-child(5) { top: 10%; left: 88%; animation-delay: 2.1s; animation-duration: 2.5s; transform: scale(1); }
.wc_twinkle:nth-child(6) { top: 22%; left: 93%; animation-delay: 1.1s; animation-duration: 2.8s; transform: scale(1.3); }

@keyframes twinkleStar {
	0%, 100% { opacity: 0; transform: rotate(0deg) scale(0.4); }
	50% { opacity: 1; transform: rotate(90deg) scale(1.2); }
}

/* 축구공 영역 (대한민국 / 체코) */
.wc_ball_korea {
	position: absolute;
	z-index: 10;
	top: 11.2%;
	left: 8%;
	width: 30%;
	text-align: center;
}
.wc_ball_czech {
	position: absolute;
	z-index: 10;
	top: 11.2%;
	right: 8%;
	width: 30%;
	text-align: center;
}

.wc_ball_korea .wc_ball_img {
	opacity: 0;
	animation: rollFromLeft 1.2s ease-out 0.5s forwards;
}
.wc_ball_czech .wc_ball_img {
	opacity: 0;
	animation: rollFromRight 1.2s ease-out 0.5s forwards;
}

.wc_ball_img {
	width: 100%;
	height: auto;
	display: block;
	filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
}
.wc_country_name {
	display: block;
	margin-top: 50px;
	color: #fff;
	font-size: 46px;
	font-weight: bold;
	font-family: 'GmarketSansMedium', sans-serif;
}

@keyframes rollFromLeft {
	0% { transform: translateX(-110%) rotate(-270deg); opacity: 0; }
	100% { transform: translateX(0) rotate(0deg); opacity: 1; }
}

@keyframes rollFromRight {
	0% { transform: translateX(110%) rotate(270deg); opacity: 0; }
	100% { transform: translateX(0) rotate(0deg); opacity: 1; }
}

/* 첫 번째 버튼 섹션 */
.wc_predict_section {
	position: absolute;
	z-index: 10;
	left: 0;
	width: 100%;
	top: 20.6%;       
	height: 7.5%;    
	display: flex;
	justify-content: center;
	align-items: center;
}
/* 두 번째 버튼 섹션 */
.wc_next_section {
	position: absolute;
	z-index: 10;
	left: 0;
	width: 100%;
	top: 27.6%;
	height: 7.5%;    
	display: flex;
	justify-content: center;
	align-items: center;
}
.wc_predict_btn {
	width: 30%;     
	height: auto;
	display: block;
	cursor: pointer;
}

/* 배경색과 라운딩이 있는 실제 스코어보드 박스 섹션 */
.wc_form_section {
	position: absolute;
	z-index: 10;
	left: 50%;
	transform: translateX(-50%);
	top: 75.9%;
	width: 82%;
	background-color: #1b2331;
	border-radius: 15px;
	padding: 70px 40px;
	display: flex;
	flex-direction: column;
	gap: 80px;
}

/* 상단 날짜 및 대진 텍스트 스타일 */
.wc_match_info {
	text-align: center;
	color: #fff;
}
.wc_match_date {
	display: block;
	color: #626974;
	font-size: 20px;
	margin-bottom: 25px;
	font-weight: bold;
}

.wc_match_vs_wrap {
	display: flex;
	justify-content: center;
	align-items: center;
	width: 100%;
	font-size: 36px;
	font-weight: bold;
}
.wc_match_vs_wrap span {
	flex: 1;
	width: 33.33%;
}
.wc_match_vs_wrap span:first-child { text-align: right; }
.wc_match_vs_wrap .vs_txt { text-align: center; color: #626974; }
.wc_match_vs_wrap span:last-child { text-align: left; }

/* 섹션 소제목 공통 스타일 */
.wc_group_title {
	display: block;
	text-align: center;
	color: #626974;
	font-size: 24px;
	font-weight: bold;
	margin-bottom: 15px;
}

/* 승패 선택 내부 영역 */
.wc_select_group_wrap {
	width: 100%;
}
.wc_select_group {
	display: flex;
	background-color: #242f43; 
	border-radius: 14px;
	padding: 15px;
}
.wc_select_label {
	flex: 1;
	display: flex;
	justify-content: center;
	align-items: center;
	height: 65px;
	color: #a8afbd;
	font-size: 24px;
	font-weight: bold;
	cursor: pointer;
	border-radius: 10px;
	transition: all 0.15s ease;
}
.wc_select_input { display: none; }
.wc_select_input:checked + .wc_select_label { background-color: #35445e; color: #fff; }

/* 스코어 예측 내부 영역 */
.wc_score_group_wrap {
	width: 100%;
}
.wc_score_group {
	display: flex;
	justify-content: space-between;
	align-items: center;
	background-color: #242f43;
	border-radius: 14px;
	padding: 50px 60px;
}
.wc_score_team {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 15px;
	width: 38%;
}
.wc_score_team span {
	color: #a8afbd;
	font-size: 22px;
	font-weight: bold;
}
.wc_score_select {
	width: 100% !important;
	height: 60px !important;
	background-color: #2e3d56 !important;
	color: #fff !important;
	font-size: 26px !important;
	font-weight: bold !important;
	border: none !important;
	outline: none !important;
	border-radius: 10px !important;
	text-align: center !important;
	text-align-last: center !important;
	cursor: pointer !important;
	-webkit-appearance: menulist !important;
	-moz-appearance: menulist !important;
	appearance: menulist !important;
	padding-right: 0 !important;
}
.wc_score_divider {
	color: #2e3d56;
	font-size: 32px;
	font-weight: bold;
	margin-top: 38px;
}

/* 예측 완료 제출 버튼 */
.wc_submit_btn {
	width: 100%;
	height: 70px;
	background-color: #2563eb;
	color: #fff;
	font-size: 26px;
	font-weight: normal;
	border: none;
	border-radius: 14px;
	cursor: pointer;
	transition: background-color 0.2s ease;
	margin-top: 10px;
}
.wc_submit_btn:hover { background-color: #1d4ed8; }
.wc_score_select, .wc_select_label { -webkit-tap-highlight-color: transparent; outline: none; }

/* 완료 팝업 */
.wc_popup {
	position: fixed;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%) scale(0.9);
	width: 320px;
	background: #fff;
	border-radius: 20px;
	padding: 35px 25px;
	text-align: center;
	z-index: 9999;
	opacity: 0;
	pointer-events: none;
	transition: all 0.2s ease;
}

.wc_popup.active {
	opacity: 1;
	pointer-events: auto;
	transform: translate(-50%, -50%) scale(1);
}

.wc_popup_text {
	font-size: 22px;
	font-weight: normal;
	color: #222;
	margin-bottom: 25px;
}

.wc_popup_btn {
	width: 100%;
	height: 50px;
	border: 0;
	border-radius: 12px;
	background: #2563eb;
	color: #fff;
	font-size: 18px;
	cursor: pointer;
	outline: none;
	-webkit-tap-highlight-color: transparent;
}

@media screen and (max-width: 986px) {
	.wc_form_section {
		padding: 40px 40px;
		gap: 50px;
	}
}

@media screen and (max-width: 810px) {
	.wc_form_section {
		top: 75.5%;
		gap: 40px;
		border-radius: 10px;
	}
}

@media screen and (max-width: 768px) {
    .wc_star {
        width: 60px;
    }
    .wc_star:nth-child(2) {
        width: 90px;
    }
    .wc_star:nth-child(3) {
        width: 50px;
    }
    .wc_twinkle {
        width: 16px;
        height: 16px;
    }
    .wc_twinkle::before {
        height: 2px !important;
    }
    .wc_twinkle::after {
        width: 2px !important;
    }
}

@media screen and (max-width: 685px) {
    .wc_country_name {
        font-size: 28px;
        margin-top: 20px;
    }

    .wc_form_section {
        width: 82%; 
        padding: 40px 20px;
        gap: 30px;
    }
    .wc_match_date {
        font-size: 16px;
        margin-bottom: 15px;
    }
    .wc_group_title {
        font-size: 18px;
        margin-bottom: 10px;
    }
    .wc_match_vs_wrap {
        font-size: 24px;
    }

    .wc_select_label {
        font-size: 16px;
        height: 50px;
    }

    .wc_score_group {
        padding: 20px;
    }

    .wc_score_team span {
        font-size: 16px;
    }

	.wc_score_select {
        height: 45px !important;
        font-size: 18px !important;
    }

    .wc_score_divider {
        font-size: 24px;
        margin-top: 25px;
    }

    .wc_submit_btn {
        height: 55px;
        font-size: 20px;
    }
}

@media screen and (max-width: 512px) {
    .wc_form_section {
        padding: 20px 15px;
        gap: 20px;
    }
	.wc_match_vs_wrap {
        font-size: 20px;
    }
    .wc_select_label {
        font-size: 14px;
        height: 45px;
    }
	.wc_select_group {
		padding: 5px;
	}
	.wc_score_group {
		padding: 10px;
    }
    .wc_score_team span {
        font-size: 14px;
    }    
	.wc_score_select {
        height: 40px !important;
        font-size: 16px !important;
    }
    .wc_submit_btn {
        height: 50px;
        font-size: 18px;
    }
}

@media screen and (max-width: 400px) {
    .wc_country_name {
        font-size: 24px;
    }

    .wc_form_section {
        padding: 20px 10px;
        gap: 15px;
    }
    
    .wc_match_date { font-size: 14px; }
    .wc_match_vs_wrap { font-size: 20px; }
    .wc_group_title { font-size: 16px; }
    
    .wc_select_label {
        font-size: 12px;
        height: 40px;
    }
    
    .wc_score_team span { font-size: 13px; }
	.wc_score_select {
        height: 35px !important;
        font-size: 14px !important;
    }
    
    .wc_submit_btn {
        height: 45px;
        font-size: 16px;
    }

	.wc_star { width: 40px !important; top: 0 !important; }
    .wc_star:nth-child(2) { width: 60px !important; }
    .wc_star:nth-child(1) { right: 5%; }
    .wc_star:nth-child(2) { right: 35%; }
    .wc_star:nth-child(3) { right: 65%; }
    
    .wc_twinkle { width: 10px !important; height: 10px !important; }
    .wc_twinkle::before { height: 1px !important; }
    .wc_twinkle::after { width: 1px !important; }
    
	.wc_twinkle:nth-child(1) { top: 12%; left: 5%; }
    .wc_twinkle:nth-child(2) { top: 18%; left: 20%; }
    .wc_twinkle:nth-child(3) { top: 15%; left: 40%; }
    .wc_twinkle:nth-child(4) { top: 20%; left: 65%; }
    .wc_twinkle:nth-child(5) { top: 13%; left: 80%; }
    .wc_twinkle:nth-child(6) { top: 17%; left: 90%; }
}

@media screen and (max-width: 360px) {
	.wc_country_name {
        font-size: 20px;
    }

    .wc_form_section {
        padding: 15px 8px;
        gap: 12px;
    }
    
    .wc_match_date { font-size: 12px; }
    .wc_match_vs_wrap { font-size: 18px; }
    .wc_group_title { font-size: 14px; }
    
    .wc_select_label {
        font-size: 11px;
        height: 35px;
    }
    
    .wc_score_team span { font-size: 12px; }
	.wc_score_select {
        height: 32px !important;
        font-size: 13px !important;
    }
    .wc_score_divider { font-size: 20px; margin-top: 20px; }
    
    .wc_submit_btn {
        height: 40px;
        font-size: 14px;
    }
}
    </style>
</head>
<body>    
    <div class="wc_event_wrap">
        
        <img src="img/bg.jpg" alt="이벤트 배경" class="wc_bg_img">

        <div class="wc_shooting_stars">
            <div class="wc_star"></div>
            <div class="wc_star"></div>
            <div class="wc_star"></div>
        </div>

        <div class="wc_twinkle_stars">
            <div class="wc_twinkle"></div>
            <div class="wc_twinkle"></div>
            <div class="wc_twinkle"></div>
            <div class="wc_twinkle"></div>
            <div class="wc_twinkle"></div>
            <div class="wc_twinkle"></div>
        </div>

        <div class="wc_ball_korea">
            <img src="img/kor.png" alt="대한민국 축구공" class="wc_ball_img">
            <span class="wc_country_name">대한민국</span>
        </div>

        <div class="wc_ball_czech">
            <img src="img/cze.png" alt="체코 축구공" class="wc_ball_img">
            <span class="wc_country_name">체코</span>
        </div>

        <div class="wc_predict_section">
            <img src="img/predict_button.png" alt="예측하기" class="wc_predict_btn wc_scroll_trigger">
        </div>

        <div class="wc_next_section">
            <img src="img/predict_button.png" alt="예측하기2" class="wc_predict_btn wc_scroll_trigger">
        </div>

        <form id="wc_predict_form" class="wc_form_section" onsubmit="return false;">
            
            <div class="wc_match_info">
                <span class="wc_match_date">6월 12일 &bull; 오전 11:00</span>
                <div class="wc_match_vs_wrap">
                    <span>대한민국</span>
                    <span class="vs_txt">VS</span>
                    <span>체코</span>
                </div>
            </div>

            <div class="wc_select_group_wrap">
                <span class="wc_group_title">승패 선택</span>
                <div class="wc_select_group">
                    <input type="radio" id="wc_win_kor" name="wc_match_result" class="wc_select_input" value="KOR">
                    <label for="wc_win_kor" class="wc_select_label">대한민국</label>

                    <input type="radio" id="wc_win_draw" name="wc_match_result" class="wc_select_input" value="DRAW">
                    <label for="wc_win_draw" class="wc_select_label">무승부</label>

                    <input type="radio" id="wc_win_cze" name="wc_match_result" class="wc_select_input" value="CZE">
                    <label for="wc_win_cze" class="wc_select_label">체코</label>
                </div>
            </div>

            <div class="wc_score_group_wrap">
                <span class="wc_group_title">스코어 예측</span>
                <div class="wc_score_group">
                    <div class="wc_score_team">
                        <span>대한민국</span>
                        <select class="wc_score_select" name="wc_score_kor">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>

                    <div class="wc_score_divider">:</div>

                    <div class="wc_score_team">
                        <span>체코</span>
                        <select class="wc_score_select" name="wc_score_cze">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="wc_submit_btn">예측 완료</button>

        </form>

    </div>

	<div class="wc_popup" id="wc_complete_popup">
		<div class="wc_popup_text">
			선택이 완료되었습니다!
		</div>
		<button class="wc_popup_btn" onclick="closePopup()">확인</button>
	</div>

    <script>
        document.querySelectorAll('.wc_scroll_trigger').forEach(function(button) {
            button.addEventListener('click', function() {
                var targetForm = document.getElementById('wc_predict_form');
                if (!targetForm) return;

                // 목표 스크롤 위치 계산 (화면 중앙 정렬 배치용)
                var targetPosition = window.pageYOffset + targetForm.getBoundingClientRect().top - (window.innerHeight / 2) + (targetForm.offsetHeight / 2);
                var startPosition = window.pageYOffset;
                var distance = targetPosition - startPosition;
                var startTime = null;
                var duration = 800; // [조절 가능] 슬라이드가 유지되는 총 시간 (800ms = 0.8초)

                // 애니메이션 가속도 제어식 (Cubic Ease-Out 효과로 우아하게 감속정지)
                function easeOutCubic(t, b, c, d) {
                    t /= d;
                    t--;
                    return c * (t * t * t + 1) + b;
                }

                function scrollAnimation(currentTime) {
                    if (startTime === null) startTime = currentTime;
                    var timeElapsed = currentTime - startTime;
                    var run = easeOutCubic(timeElapsed, startPosition, distance, duration);
                    window.scrollTo(0, run);
                    if (timeElapsed < duration) requestAnimationFrame(scrollAnimation);
                }

                requestAnimationFrame(scrollAnimation);
            });
        });

		document.querySelector('.wc_submit_btn').addEventListener('click', function(){

			document.getElementById('wc_complete_popup').classList.add('active');

		});


		function closePopup(){
			document.getElementById('wc_complete_popup').classList.remove('active');
		}
    </script>
</body>
</html>
