<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여름 이벤트</title>

  <link
    rel="preload"
    as="image"
    href="img/summer_bg.jpg"
    fetchpriority="high"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      margin: 0;
      overflow-x: hidden;
      background: #fff;
      color: #222;
      font-family: Pretendard, "Noto Sans KR", Arial, sans-serif;
    }

    button {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border: 0;
    }

    .summer-event-page {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #4bc3f2;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    .summer-event-page.page-ready {
      opacity: 1;
    }

    .summer-page-bg {
      display: block;
      width: 100%;
      max-width: none;
      pointer-events: none;
      user-select: none;
    }

    .summer-event-stage {
      position: absolute;
      top: 0;
      left: 50%;
      width: min(100%, 1280px);
      height: 100%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .summer-title-area {
      position: absolute;
      top: 5%;
      left: 53%;
      width: 69%;
      transform: translateX(-50%);
      z-index: 5;
    }

    .summer-title-image {
      width: 100%;
      animation: titleFloat 2.8s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes titleFloat {
      0%,
      100% {
        transform: translate3d(0, 3px, 0);
      }

      50% {
        transform: translate3d(0, -6px, 0);
      }
    }

    .summer-subtitle-area {
      position: absolute;
      top: 16.5%;
      left: 50%;
      width: 78%;
      transform: translateX(-50%);
      z-index: 5;
    }

    .summer-subtitle-image {
      position: relative;
      width: 100%;
      z-index: 2;
    }

    .summer-splash-area {
      position: absolute;
      top: 39%;
      left: 53%;
      width: 90%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    .summer-splash-image {
      width: 100%;
	  transform-origin: 50% 70%;
	  animation: waterSplash 3.2s ease-in-out infinite;
	  will-change: transform, opacity;
    }

	@keyframes waterSplash {
		0% {
			opacity: 0.65;
			transform: scale(0.72);
		}

		12% {
			opacity: 1;
			transform: scale(1.12);
		}

		20% {
			transform: scale(0.96);
		}

		28%,
		100% {
			opacity: 1;
			transform: scale(1);
		}
	}

    .summer-object-area {
      position: absolute;
      top: 23.3%;
      left: 1%;
      width: 90%;
      height: 5%;
      pointer-events: none;
      z-index: 6;
    }

    .summer-ball-image,
    .summer-tube-image,
    .summer-duck-tube-image {
      position: absolute;
      height: auto;
    }

    .summer-ball-image {
      left: 7%;
      bottom: 30%;
      width: 13%;
	  transform-origin: 50% 100%;
	  animation: ballBounce 2.4s ease-in-out infinite;
	  will-change: transform;
    }

    .summer-tube-image {
      left: 25%;
      bottom: 5%;
      width: 37%;
	  transform-origin: 50% 70%;
	  animation: pinkTubeFloat 3.4s ease-in-out infinite;
	  will-change: transform;
    }

    .summer-duck-tube-image {
      right: 8%;
      bottom: 8%;
      width: 22%;
	  transform-origin: 50% 70%;
	  animation: duckTubeFloat 3.8s ease-in-out infinite;
	  animation-delay: -1.1s;
	  will-change: transform;
    }

	@keyframes ballBounce {
	0%,
	100% {
		transform: translateY(0) scale(1);
	}

	45% {
		transform: translateY(-6px) scale(1);
	}

	55% {
		transform: translateY(0) scale(1.04, 0.96);
	}

	65% {
		transform: translateY(-2px) scale(0.99, 1.01);
	}

	75% {
		transform: translateY(0) scale(1);
	}
	}

	@keyframes pinkTubeFloat {
	0%,
	100% {
		transform: translateY(2px) rotate(-2deg);
	}

	50% {
		transform: translateY(-5px) rotate(2deg);
	}
	}

	@keyframes duckTubeFloat {
	0%,
	100% {
		transform: translateY(-3px) rotate(2deg);
	}

	50% {
		transform: translateY(3px) rotate(-2deg);
	}
	}

    .vote {
      position: absolute;
      top: 30%;
      left: 50%;
      width: 95%;
      padding: 8% 6%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
    }

    .vote-bg-area {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .vote-bg-image {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .vote-title {
      position: relative;
      width: 70%;
      margin: 3% auto 6%;
      z-index: 2;
    }

    .vote-title-image {
      width: 100%;
    }

    .options {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.8vw, 18px);
      width: 95%;
      margin: 0 auto;
      z-index: 2;
    }

    .option {
      width: 100%;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(20px);
      transition:
        opacity 0.65s ease,
        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.2s ease;
    }

    .options.is-visible .option {
      opacity: 1;
      transform: translateY(0);
    }

    .options.is-visible .option:nth-child(1) {
      transition-delay: 0s;
    }

    .options.is-visible .option:nth-child(2) {
      transition-delay: 0.15s;
    }

    .options.is-visible .option:nth-child(3) {
      transition-delay: 0.3s;
    }

    .options.is-visible .option:nth-child(4) {
      transition-delay: 0.45s;
    }

    .options.is-visible .option:hover {
      transition-delay: 0s;
      transform: translateY(-2px);
    }

    .options.is-visible .option:active {
      transition-delay: 0s;
      transform: scale(0.98);
    }

    .option.selected {
      filter:
        drop-shadow(0 0 5px rgba(255, 255, 255, 0.95))
        drop-shadow(0 7px 12px rgba(0, 98, 160, 0.25));
    }

    .option.disabled {
      cursor: not-allowed;
      pointer-events: none;
    }

    .options.is-visible .option.disabled {
      opacity: 0.5;
    }

    .option-image {
      width: 100%;
      pointer-events: none;
    }

    .option-a-image {}
    .option-b-image {}
    .option-c-image {}
    .option-d-image {}

    /* 상품 안내 이미지 */
    .reward-area {
      position: absolute;
      top: 46%;
      left: 50%;
      width: 95%;
      transform: translateX(-50%);
      z-index: 5;
    }

    .reward-image {
      width: 100%;
    }

    .results-section {
      position: absolute;
      top: 57%;
      left: 50%;
      width: 95%;
      padding: 0;
      transform: translateX(-50%);
      z-index: 5;
    }

    .results {
      position: relative;
      margin: 0;
      padding:
        clamp(36px, 6.5vw, 90px)
        clamp(24px, 5vw, 50px);
      border-radius: clamp(16px, 3vw, 30px);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 8px 24px rgba(0, 110, 170, 0.16);
    }

    .results h3 {
      margin: 0 0 clamp(25px, 4.6vw, 46px);
      color: #0877c9;
      font-size: clamp(27px, 5.2vw, 48px);
      font-weight: 800;
      text-align: center;
    }

    .result-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.94);
      text-align: center;
      font-size: clamp(20px, 4vw, 34px);
      font-weight: 700;
      line-height: 1.5;
      z-index: 5;
    }

    .result-overlay p {
      margin: 0;
      padding:
        clamp(22px, 4vw, 38px)
        clamp(26px, 5vw, 48px);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(0, 97, 158, 0.1);
    }

    .result-item {
      margin-bottom: clamp(16px, 3vw, 28px);
      text-align: left;
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-name {
      color: #222;
      font-size: clamp(20px, 3.8vw, 34px);
      font-weight: 700;
      line-height: 1.4;
      word-break: keep-all;
    }

    .bar {
      position: relative;
      height: clamp(36px, 6vw, 56px);
      margin: clamp(11px, 1.8vw, 18px) 0;
      overflow: visible;
      border-radius: 999px;
      background: #eaf7fd;
    }

    .fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(180deg, #45c8ff, #078ad8);
      box-shadow: inset 0 -2px 0 rgba(0, 91, 150, 0.12);
    }

    .winner-badge {
      position: absolute;
      top: -32px;
      right: -10px;
      width: clamp(72px, 12vw, 110px);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.6);
      z-index: 2;
    }

    .result-item.winner .winner-badge {
      animation:
        winnerPop 0.4s
        cubic-bezier(0.25, 0.9, 0.35, 1)
        0.2s forwards;
    }

    @keyframes winnerPop {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .result-percent {
      color: #078ad8;
      font-size: clamp(19px, 3.6vw, 30px);
      font-style: normal;
      font-weight: 800;
    }

    /* 이벤트 내용 이미지 */
    .event-info-area {
      position: absolute;
      top: 73%;
      left: 50%;
      width: 95%;
      transform: translateX(-50%);
      z-index: 5;
    }

    .event-info-image {
      width: 100%;
    }

    .notice-section {
      width: 100%;
      padding: 120px 30px;
      background: #000;
    }

    .notice-inner {
      width: 90%;
      max-width: 1280px;
      margin: 0 auto;
    }

    .notice-image {
      display: block;
      width: 100%;
      height: auto;
    }

	@media screen and (min-width: 1281px) {
	.summer-event-page {
		height: 8660px;
	}

	.summer-page-bg {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 8660px;
		object-fit: fill;
	}

	.summer-event-stage {
		width: 1280px;
		height: 8660px;
	}
	}

    @media screen and (max-width: 1024px) {
      .summer-event-stage {
        width: 100%;
      }

      .results {
        padding: 6.5vw 4.88vw;
        border-radius: 2.93vw;
      }

      .results h3 {
        margin-bottom: 4.49vw;
        font-size: 4.69vw;
      }

      .result-overlay {
        font-size: 3.32vw;
      }

      .result-overlay p {
        padding: 3.71vw 4.69vw;
        border-radius: 1.56vw;
      }

      .result-item {
        margin-bottom: 2.73vw;
      }

      .result-name {
        font-size: 3.32vw;
      }

      .bar {
        height: 5.47vw;
        margin: 1.76vw 0;
      }

      .winner-badge {
        top: -3.1vw;
        right: -0.8vw;
        width: 10.5vw;
      }

      .result-percent {
        font-size: 2.93vw;
      }

    .event-info-area {
      top: 74%;
    }

      .notice-section {
        padding: 11.72vw 2.93vw;
      }
    }

    @media screen and (max-width: 565px) {
      .results {
        padding-top: 5vw;
        padding-bottom: 5vw;
      }
    }

    @media screen and (max-width: 480px) {
      .results {
        padding-top: 4vw;
        padding-bottom: 4vw;
      }
    }

    @media screen and (max-width: 420px) {
      .results {
        padding-top: 3vw;
        padding-bottom: 3vw;
      }

      .result-item {
        margin-bottom: 0;
      }
    }

    @media screen and (max-width: 360px) {
      .results {
        padding-top: 2vw;
        padding-bottom: 2vw;
      }

    .event-info-area {
      top: 74.5%;
    }
    }

    @media (prefers-reduced-motion: reduce) {
      .summer-title-image {
        animation: none;
      }

      .option,
      .options.is-visible .option {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }

    /* 토스트 메시지 */
    #toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      padding: 12px 22px;
      border-radius: 30px;
      background: #078ad8;
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity 0.3s ease;
      z-index: 50;
    }

    #toast.show {
      opacity: 0.92;
    }

    /* 투표 완료 팝업 */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.45);
      z-index: 60;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 320px;
      padding: 30px 36px;
      border-radius: 16px;
      background: #fff;
      text-align: center;
      font-size: 18px;
    }

    .modal-content h3,
    .modal-content p {
      margin: 0;
    }

    .modal-content h3 {
      margin-bottom: 15px;
    }

    .modal-content p {
      line-height: 1.5;
    }

    .modal-content button {
      margin-top: 30px;
      padding: 10px 24px;
      border-radius: 60px;
      background: #078ad8;
      color: #fff;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <main class="summer-event-page">
    <img
      src="img/summer_bg.jpg"
      class="summer-page-bg"
      id="summerPageBg"
      alt=""
      fetchpriority="high"
    >

    <div class="summer-event-stage">

      <!-- 1. '이번 여름, 당신의 선택은?' 타이틀 -->
      <div
        class="summer-title-area"
        id="summerTitleArea"
      >
        <img
          src="img/summer_title.png"
          class="summer-title-image"
          alt="이번 여름, 당신의 선택은?"
        >
      </div>

      <!-- 2. 서브 타이틀 -->
      <div class="summer-subtitle-area">
        <img
          src="img/summer_subtitle.png"
          class="summer-subtitle-image"
          alt="다들 여름 보내는 방식은 제각각! 당신이 이끌은 어떤 모습인가요? 가장 나다운 선택지를 골라 지금 투표해 주세요!"
        >

        <!-- 서브 타이틀 뒤 물 튀는 이미지 -->
        <div
          class="summer-splash-area"
          id="summerSplashArea"
        >
          <img
            src="img/summer_splash.png"
            class="summer-splash-image"
            alt=""
          >
        </div>
      </div>

      <!-- 3. 개별 오브젝트 이미지 -->
      <div class="summer-object-area">
        <img
          src="img/summer_ball.png"
          class="summer-ball-image"
          alt="비치볼"
        >

        <img
          src="img/summer_tube.png"
          class="summer-tube-image"
          alt="튜브"
        >

        <img
          src="img/summer_duck_tube.png"
          class="summer-duck-tube-image"
          alt="오리 튜브"
        >
      </div>

      <!-- 4. 투표 영역 -->
      <div class="vote">
        <div class="vote-bg-area">
          <img
            src="img/vote_bg.png"
            class="vote-bg-image"
            alt=""
          >
        </div>

        <div class="vote-title">
          <img
            src="img/vote_title.png"
            class="vote-title-image"
            alt="아래 4개 중 하나를 선택해 주세요"
          >
        </div>

        <div class="options">
          <button
            type="button"
            class="option option-a"
            data-label="A. 방콕이 최고지!"
          >
            <img
              src="img/option_a.png"
              class="option-image option-a-image"
              alt="A. 방콕이 최고지! 집에서 에어컨 틀고 뒹굴뒹굴"
            >
          </button>

          <button
            type="button"
            class="option option-b"
            data-label="B. 쉬는 것보다 통장 잔고가 힐링이지"
          >
            <img
              src="img/option_b.png"
              class="option-image option-b-image"
              alt="B. 쉬는 것보다 통장 잔고가 힐링이지"
            >
          </button>

          <button
            type="button"
            class="option option-c"
            data-label="C. 연락처 잠수! 아무도 없는 곳에서 혼자 조용히 충전"
          >
            <img
              src="img/option_c.png"
              class="option-image option-c-image"
              alt="C. 연락처 잠수! 아무도 없는 곳에서 혼자 조용히 충전"
            >
          </button>

          <button
            type="button"
            class="option option-d"
            data-label="D. 여름은 물놀이지! 바다는 체력이고 무조건 GO"
          >
            <img
              src="img/option_d.png"
              class="option-image option-d-image"
              alt="D. 여름은 물놀이지! 바다는 체력이고 무조건 GO"
            >
          </button>
        </div>
      </div>

      <!-- 5. 상품 안내 -->
      <div class="reward-area">
        <img
          src="img/reward.png"
          class="reward-image"
          alt="이벤트 상품 안내"
        >
      </div>

      <!-- 6. 투표 결과 -->
      <section class="results-section">
        <section
          class="results"
          id="resultSection"
        >
          <h3>투표 결과</h3>

          <div
            class="result-overlay"
            id="resultOverlay"
          >
            <p>
              이벤트 종료 후<br>
              결과가 공개됩니다.
            </p>
          </div>

          <div class="result-item">
            <span class="result-name">
              A. 🏡 방콕이 최고지!
            </span>

            <div class="bar">
              <div
                class="fill"
                id="bar-a"
              ></div>

              <img
                src="img/winner.png"
                class="winner-badge"
                alt="최다 득표"
              >
            </div>

            <em
              class="result-percent"
              id="percent-a"
            >0%</em>
          </div>

          <div class="result-item">
            <span class="result-name">
              B. 💰 쉬는 것보다 통장 잔고가 힐링이지
            </span>

            <div class="bar">
              <div
                class="fill"
                id="bar-b"
              ></div>

              <img
                src="img/winner.png"
                class="winner-badge"
                alt="최다 득표"
              >
            </div>

            <em
              class="result-percent"
              id="percent-b"
            >0%</em>
          </div>

          <div class="result-item">
            <span class="result-name">
              C. 📵 아무도 없는 곳에서 혼자 조용히 충전
            </span>

            <div class="bar">
              <div
                class="fill"
                id="bar-c"
              ></div>

              <img
                src="img/winner.png"
                class="winner-badge"
                alt="최다 득표"
              >
            </div>

            <em
              class="result-percent"
              id="percent-c"
            >0%</em>
          </div>

          <div class="result-item">
            <span class="result-name">
              D. 🔫 여름은 물놀이지!
            </span>

            <div class="bar">
              <div
                class="fill"
                id="bar-d"
              ></div>

              <img
                src="img/winner.png"
                class="winner-badge"
                alt="최다 득표"
              >
            </div>

            <em
              class="result-percent"
              id="percent-d"
            >0%</em>
          </div>
        </section>
      </section>

      <!-- 7. 이벤트 내용 -->
      <div class="event-info-area">
        <img
          src="img/event_info.png"
          class="event-info-image"
          alt="이벤트 내용, 기간, 대상, 당첨자 발표, 상품 지급일, 지급 기준"
        >
      </div>
    </div>
  </main>

  <!-- 8. 유의사항 -->
  <section class="notice-section">
    <div class="notice-inner">
      <img
        src="img/notice.png"
        class="notice-image"
        alt="이벤트 유의사항"
      >
    </div>
  </section>

  <div id="toast">참여 완료</div>

  <div
    class="modal"
    id="voteModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >
    <div class="modal-content">
      <h3 id="modalTitle">투표 완료</h3>

      <p id="modalText"></p>

      <button
        type="button"
        id="modalCloseButton"
      >
        확인
      </button>
    </div>
  </div>

  <script>
    /* 배경 이미지가 준비된 후 페이지 표시 */
    const summerEventPage =
      document.querySelector(".summer-event-page");

    const summerPageBg =
      document.getElementById("summerPageBg");

    let pageRevealTimer;

    function showSummerEventPage() {
      if (
        summerEventPage.classList.contains("page-ready")
      ) {
        return;
      }

      clearTimeout(pageRevealTimer);

      requestAnimationFrame(() => {
        summerEventPage.classList.add("page-ready");
      });
    }

    async function prepareSummerEventPage() {
      if (!summerPageBg.complete) {
        await new Promise((resolve) => {
          summerPageBg.addEventListener(
            "load",
            resolve,
            { once: true }
          );

          summerPageBg.addEventListener(
            "error",
            resolve,
            { once: true }
          );
        });
      }

      if (
        summerPageBg.naturalWidth > 0 &&
        typeof summerPageBg.decode === "function"
      ) {
        try {
          await summerPageBg.decode();
        } catch (error) {
          /* 디코딩 실패 시에도 페이지는 표시 */
        }
      }

      showSummerEventPage();
    }

    prepareSummerEventPage();

    /* 이미지 오류나 네트워크 지연 시 화면이 계속 숨겨지는 것 방지 */
    pageRevealTimer =
      setTimeout(showSummerEventPage, 3000);

    /* false: 이벤트 진행 중
       true: 이벤트 종료 */
    const EVENT_ENDED = false;

    /* 디자인 확인용 투표 결과 */
    const voteResult = {
      a: 20,
      b: 15,
      c: 12,
      d: 40
    };

    const options =
      document.querySelectorAll(".option");

    const toast =
      document.getElementById("toast");

    const modal =
      document.getElementById("voteModal");

    const modalText =
      document.getElementById("modalText");

    const modalCloseButton =
      document.getElementById("modalCloseButton");

    const resultOverlay =
      document.getElementById("resultOverlay");

    const resultSection =
      document.getElementById("resultSection");

    /* 결과 막대 애니메이션 */
    function animateBar(
      barId,
      percentId,
      target,
      duration = 700
    ) {
      const bar =
        document.getElementById(barId);

      const percent =
        document.getElementById(percentId);

      let startTime = null;

      function step(currentTime) {
        if (startTime === null) {
          startTime = currentTime;
        }

        const progress =
          (currentTime - startTime) / duration;

        const currentValue = Math.min(
          Math.floor(progress * target),
          target
        );

        bar.style.width = `${currentValue}%`;
        percent.textContent = `${currentValue}%`;

        if (currentValue < target) {
          requestAnimationFrame(step);
        }
      }

      requestAnimationFrame(step);
    }

    /* 상위 2개 항목 계산 */
    function getTopTwoKeys(data) {
      return Object.entries(data)
        .sort((first, second) => {
          return second[1] - first[1];
        })
        .slice(0, 2)
        .map((item) => item[0]);
    }

    /* 결과 영역 표시 */
    const resultObserver = new IntersectionObserver(
      (entries) => {
        const entry = entries[0];

        if (!entry.isIntersecting) {
          return;
        }

        if (!EVENT_ENDED) {
          resultOverlay.style.display = "flex";
          resultObserver.disconnect();
          return;
        }

        resultOverlay.style.display = "none";

        Object.keys(voteResult).forEach((key) => {
          animateBar(
            `bar-${key}`,
            `percent-${key}`,
            voteResult[key]
          );
        });

        setTimeout(() => {
          const topTwoKeys =
            getTopTwoKeys(voteResult);

          topTwoKeys.forEach((key) => {
            const resultItem = document
              .getElementById(`bar-${key}`)
              .closest(".result-item");

            resultItem.classList.add("winner");
          });
        }, 1100);

        resultObserver.disconnect();
      },
      {
        threshold: 0.3
      }
    );

    resultObserver.observe(resultSection);

    /* 선택지 순차 등장 */
    const optionList =
      document.querySelector(".options");

    const optionRevealObserver =
      new IntersectionObserver(
        (entries, observer) => {
          const entry = entries[0];

          if (!entry.isIntersecting) {
            return;
          }

          optionList.classList.add("is-visible");
          observer.unobserve(optionList);
        },
        {
          threshold: 0.25
        }
      );

    optionRevealObserver.observe(optionList);

    /* 투표 선택 */
    options.forEach((option) => {
      option.addEventListener("click", () => {
        options.forEach((item) => {
          item.classList.remove("selected");
        });

        option.classList.add("selected");
        toast.classList.add("show");

        setTimeout(() => {
          toast.classList.remove("show");
        }, 1500);

        modalText.textContent =
          `당신의 선택: ${option.dataset.label}`;

        setTimeout(() => {
          modal.classList.add("show");
        }, 400);
      });
    });

    /* 팝업 닫기 */
    function closeModal() {
      modal.classList.remove("show");
    }

    modalCloseButton.addEventListener(
      "click",
      closeModal
    );

    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Escape" &&
          modal.classList.contains("show")
        ) {
          closeModal();
        }
      }
    );

    /* 이벤트 종료 상태 */
    if (EVENT_ENDED) {
      options.forEach((option) => {
        option.classList.add("disabled");
        option.disabled = true;
      });
    }
  </script>
</body>
</html>
